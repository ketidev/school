<li class="flex items-center justify-between rounded-lg bg-gray-50 p-3">
  <span>{{ student }}</span>

  <button
    type="button"
    (click)="onDelete()"
    class="rounded-lg p-2 text-red-500 hover:bg-red-50"
    aria-label="Delete student"
    title="Delete"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M3 6h18" />
      <path d="M8 6V4h8v2" />
      <path d="m19 6-1 14H6L5 6" />
      <path d="M10 11v5" />
      <path d="M14 11v5" />
    </svg>
  </button>
</li>
